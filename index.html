<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pioneer Life Inc. — Application for Life Insurance</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<header class="app-header">
  <div class="brand">
    <div class="brand-mark">PL</div>
    <div class="brand-text">
      <h1>Pioneer Life Inc.</h1>
      <span>Application Form for Life Insurance — Interactive e-Form</span>
    </div>
  </div>
  <div class="header-actions">
    <span id="autosaveStatus" class="autosave-status">All changes saved</span>
    <button id="saveBtn" class="btn btn-ghost">💾 Save</button>
    <button id="loadBtn" class="btn btn-ghost">📂 Load</button>
    <button id="printBtn" class="btn btn-ghost">🖨️ Print</button>
    <button id="restartBtn" class="btn btn-ghost btn-danger">⟲ Restart</button>
  </div>
</header>

<div class="app-shell">
  <nav class="step-nav" id="stepNav" aria-label="Application sections">
    <div class="overall-progress">
      <div class="overall-progress-bar"><div id="overallProgressFill" class="overall-progress-fill"></div></div>
      <span id="overallProgressLabel">0% complete</span>
    </div>
    <ol id="stepList" class="step-list"></ol>
  </nav>

  <main class="content-area">
    <div id="alertBanner" class="alert-banner hidden"></div>
    <section id="stepContent" class="step-content"></section>

    <div class="step-footer">
      <button id="prevBtn" class="btn btn-secondary">← Back</button>
      <div class="step-footer-center">
        <span id="stepIndicator"></span>
      </div>
      <button id="nextBtn" class="btn btn-primary">Continue →</button>
    </div>
  </main>
</div>

<!-- Modal root for reflexive questionnaires & sub-forms -->
<div id="modalRoot" class="modal-root hidden">
  <div class="modal-backdrop" id="modalBackdrop"></div>
  <div class="modal-dialog" role="dialog" aria-modal="true">
    <div class="modal-header">
      <h2 id="modalTitle">Questionnaire</h2>
      <button id="modalCloseBtn" class="modal-close" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <span id="modalHint" class="modal-hint"></span>
      <div>
        <button id="modalCancelBtn" class="btn btn-secondary">Cancel</button>
        <button id="modalSaveBtn" class="btn btn-primary">✔ Mark as Completed</button>
      </div>
    </div>
  </div>
</div>

<input type="file" id="loadFileInput" accept="application/json" class="hidden" />

<!-- Print replica of the Pioneer Life Inc. PDF application, populated from current answers. Hidden on screen; shown only when printing. -->
<div id="printArea" class="print-area"></div>

<!-- Floating QA Test Tools menu -->
<div id="testFab" class="test-fab">
  <div id="testFabMenu" class="test-fab-menu hidden">
    <div class="test-fab-menu-title">🧪 QA Test Tools</div>
    <button id="testFillBtn" type="button" class="btn btn-primary btn-small">🎲 Fill Random Data (All Sections)</button>
    <button id="testValidateBtn" type="button" class="btn btn-secondary btn-small">📋 Run Flow &amp; PDF Cross-Reference Check</button>
    <button id="testResetBtn" type="button" class="btn btn-outline btn-small">↺ Reset Test Data</button>
  </div>
  <button id="testFabToggle" type="button" class="test-fab-toggle" title="QA Test Tools" aria-label="Open QA test tools">🧪</button>
</div>

<!-- Test / cross-reference report modal (independent of the questionnaire modal) -->
<div id="testReportModal" class="modal-root hidden">
  <div class="modal-backdrop" id="testReportBackdrop"></div>
  <div class="modal-dialog test-report-dialog" role="dialog" aria-modal="true">
    <div class="modal-header">
      <h2 id="testReportTitle">Flow &amp; PDF Cross-Reference Report</h2>
      <button id="testReportCloseX" class="modal-close" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body" id="testReportBody"></div>
    <div class="modal-footer">
      <span id="testReportHint" class="modal-hint"></span>
      <div>
        <button id="testReportCloseBtn" class="btn btn-primary">Close</button>
      </div>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/fields.js"></script>
<script src="js/rules.js"></script>
<script src="js/questionnaires.js"></script>
<script src="js/sections.js"></script>
<script src="js/validate.js"></script>
<script src="js/app.js"></script>
<script src="js/printview.js"></script>
<script src="js/testkit.js"></script>
</body>
</html>
